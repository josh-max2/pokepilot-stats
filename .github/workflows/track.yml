name: track

on:
  schedule:
    - cron: "17 * * * *"   # hourly; GitHub may skip some scheduled runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yt-dlp
      - run: python track.py
      - name: commit snapshot
        run: |
          git config user.name "pokepilot-tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push
